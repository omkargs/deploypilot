[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deploypilot"
version = "0.1.0"
description = "AI-powered deployment intelligence. Predict CI failures before they happen."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "PyGithub>=2.3.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
deploypilot = "deploypilot.cli:app"

[tool.setuptools.packages.find]
include = ["deploypilot*"]
